<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Subtitle fixture</title>
<style>
  body { margin: 0; background: #0b0b0b; color: #eaeaea; font: 14px/1.6 system-ui, sans-serif; }
  .player { position: relative; width: 720px; height: 405px; margin: 24px auto; background: #000; }
  video { width: 100%; height: 100%; display: block; background: #000; }
  /* Mimics a player that paints its own captions over the video. */
  .player-captions {
    position: absolute; left: 0; right: 0; bottom: 36px; text-align: center;
    font-size: 18px; color: #fff;
  }
  .caption-line { display: inline-block; background: rgba(0, 0, 0, .6); padding: 2px 8px; }
</style>
</head>
<body>
<div class="player" id="player">
  <video id="video" muted playsinline></video>
  <div class="player-captions" id="captions" hidden>
    <span class="caption-line" id="captionLine"></span>
  </div>
</div>
<script>
  // A two second silent WAV, generated here so the media element has a real
  // timeline. TextTrack cues only become active while one exists.
  function silentWavUrl() {
    const rate = 8000;
    const samples = rate * 2;
    const buffer = new ArrayBuffer(44 + samples * 2);
    const view = new DataView(buffer);
    const write = (offset, text) => {
      for (let index = 0; index < text.length; index++) view.setUint8(offset + index, text.charCodeAt(index));
    };
    write(0, 'RIFF');
    view.setUint32(4, 36 + samples * 2, true);
    write(8, 'WAVE');
    write(12, 'fmt ');
    view.setUint32(16, 16, true);
    view.setUint16(20, 1, true);
    view.setUint16(22, 1, true);
    view.setUint32(24, rate, true);
    view.setUint32(28, rate * 2, true);
    view.setUint16(32, 2, true);
    view.setUint16(34, 16, true);
    write(36, 'data');
    view.setUint32(40, samples * 2, true);
    return URL.createObjectURL(new Blob([buffer], { type: 'audio/wav' }));
  }

  const video = document.getElementById('video');
  video.src = silentWavUrl();

  // A player that renders captions into the DOM, like YouTube does.
  window.setCaption = (text) => {
    const box = document.getElementById('captions');
    const line = document.getElementById('captionLine');
    line.textContent = text || '';
    box.hidden = !text;
  };

  // A native TextTrack, like a <video><track> page. Never enters the DOM.
  window.setCue = (text) => {
    let track = window.__track;
    if (!track) {
      track = video.addTextTrack('subtitles', 'English', 'en');
      track.mode = 'hidden';
      window.__track = track;
    }
    while (track.cues && track.cues.length) track.removeCue(track.cues[0]);
    if (!text) {
      video.currentTime = 1.9;
      return;
    }
    const cue = new VTTCue(0, 1.8, text);
    track.addCue(cue);
    const seek = () => {
      try {
        video.currentTime = 0.4;
      } catch (error) {
        /* nothing to seek yet */
      }
    };
    if (video.readyState >= 1) seek();
    else video.addEventListener('loadedmetadata', seek, { once: true });
  };
</script>
</body>
</html>
